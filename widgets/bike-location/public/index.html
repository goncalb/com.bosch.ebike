<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <link rel="stylesheet" href="./leaflet/leaflet.css" />
  <script src="./leaflet/leaflet.js"></script>
  <style>
    html, body { margin: 0; padding: 0; height: 100%; }
    #map { position: absolute; top: 12px; left: 12px; right: 12px; bottom: 64px;
           border-radius: 14px; overflow: hidden;
           background: var(--homey-background-color, #f2f2f2); touch-action: pan-y; }
    #footer {
      position: absolute; left: 12px; right: 12px; bottom: 0; height: 64px;
      padding: 8px 6px 6px; box-sizing: border-box; display: none;
      font-family: -apple-system, system-ui, sans-serif;
      background: var(--homey-background-color, #ffffff);
      overflow: hidden;
    }
    .foot-row { margin-bottom: 4px; overflow: hidden; }
    .foot-head { display: flex; align-items: center; gap: 7px; }
    .foot-dot { width: 10px; height: 10px; border-radius: 50%; flex: none; }
    .foot-name { font-size: 16px; font-weight: 700; color: var(--homey-text-color, #222);
                 white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
    .foot-time { font-size: 14px; color: var(--homey-text-color-light, #888);
                 white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
                 margin: 2px 0 0 17px; }
    #map.unlocked { touch-action: none; }
    html, body { touch-action: pan-y; }
    #empty {
      position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
      text-align: center; padding: 16px; box-sizing: border-box;
      font-family: -apple-system, system-ui, sans-serif; font-size: 13px;
      color: var(--homey-text-color-light, #888);
    }
    .bike-popup { font-family: -apple-system, system-ui, sans-serif; font-size: 12px; }
    .bike-popup a { color: #E20015; }
    .leaflet-control-attribution { font-size: 9px; }
    #lockBtn {
      position: absolute; top: 20px; right: 20px; z-index: 1000;
      width: 38px; height: 38px; border-radius: 50%; border: none;
      background: rgba(255,255,255,0.92); box-shadow: 0 1px 5px rgba(0,0,0,0.3);
      font-size: 18px; line-height: 38px; text-align: center; padding: 0;
      cursor: pointer; user-select: none; -webkit-tap-highlight-color: transparent;
    }
    #lockBtn.unlocked { background: #E20015; }
  </style>
</head>
<body class="homey-widget">
  <div id="map"></div>
  <button id="lockBtn" title="Enable pan/zoom" style="display:none">&#128274;</button>
  <div id="footer"></div>
  <div id="empty" style="display:none">
    No location available yet.<br/>
    Requires a ConnectModule with the eBike&nbsp;Alarm feature enabled.
  </div>

  <script type="text/javascript">
    function onHomeyReady(Homey) {
      Homey.ready();

      var map = null;
      var layer = null;
      var COLORS = ['#E20015', '#2962FF', '#00A05A', '#F2A900', '#7B1FA2'];

      function pinIcon(color) {
        var svg = '<svg xmlns="http://www.w3.org/2000/svg" width="30" height="42" viewBox="0 0 30 42">' +
          '<path d="M15 0C6.7 0 0 6.7 0 15c0 10.5 15 27 15 27s15-16.5 15-27C30 6.7 23.3 0 15 0z" fill="' + color + '"/>' +
          '<circle cx="15" cy="14" r="6" fill="#fff"/></svg>';
        return L.divIcon({
          className: '',
          html: svg,
          iconSize: [30, 42],
          iconAnchor: [15, 42],
          popupAnchor: [0, -40]
        });
      }
      var interactive = false;
      var deviceIds = [];

      function applyInteractivity() {
        if (!map) return;
        var handlers = [map.dragging, map.touchZoom, map.scrollWheelZoom, map.doubleClickZoom, map.boxZoom];
        handlers.forEach(function (h) { if (h) { interactive ? h.enable() : h.disable(); } });
        document.getElementById('map').classList.toggle('unlocked', interactive);
        var btn = document.getElementById('lockBtn');
        btn.innerHTML = interactive ? '&#128275;' : '&#128274;';
        btn.className = interactive ? 'unlocked' : '';
        btn.title = interactive ? 'Lock map (allow page scrolling)' : 'Enable pan/zoom';
      }
      try { deviceIds = Homey.getDeviceIds() || []; } catch (e) {}

      function relTime(iso) {
        if (!iso) return null;
        var t = Date.parse(iso);
        if (!isFinite(t)) return null;
        var mins = Math.round((Date.now() - t) / 60000);
        if (mins < 1) return 'just now';
        if (mins < 60) return mins + ' min ago';
        var hrs = Math.floor(mins / 60);
        if (hrs < 24) return hrs + ' h ago';
        return Math.floor(hrs / 24) + ' d ago';
      }

      function absTime(iso) {
        if (!iso) return null;
        try {
          var d = new Date(iso);
          return d.toLocaleDateString(undefined, { day: 'numeric', month: 'short' }) + ' ' +
                 d.toLocaleTimeString(undefined, { hour: '2-digit', minute: '2-digit', hour12: false });
        } catch (e) { return null; }
      }

      function footerTime(b) {
        var parts = [];
        var abs = absTime(b.ts || null);
        if (abs) parts.push(abs);
        var rel = relTime(b.fetchedAt);
        if (rel) parts.push('checked ' + rel);
        if (b.source === 'ride') parts.push('from last ride');
        return parts.join(' \u00b7 ') || 'No timestamp yet';
      }

      function fmtTime(entry) {
        var t = entry.ts || entry.fetchedAt;
        if (!t) return '';
        try { return new Date(t).toLocaleString(); } catch (e) { return String(t); }
      }

      function render(bikes) {
        if (!bikes || bikes.length === 0) {
          document.getElementById('empty').style.display = 'flex';
          return;
        }
        document.getElementById('empty').style.display = 'none';

        if (!map) {
          map = L.map('map', {
            zoomControl: false, attributionControl: false,
            dragging: false, touchZoom: false, scrollWheelZoom: false,
            doubleClickZoom: false, boxZoom: false, keyboard: false, tap: false
          });
          L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'
          }).addTo(map);
          L.control.attribution({ position: 'bottomleft', prefix: false }).addTo(map);
          layer = L.layerGroup().addTo(map);

          var btn = document.getElementById('lockBtn');
          btn.style.display = 'block';
          btn.addEventListener('click', function (ev) {
            ev.stopPropagation();
            interactive = !interactive;
            applyInteractivity();
          });
          applyInteractivity();
        }
        layer.clearLayers();

        var bounds = [];
        bikes.forEach(function (b, idx) {
          var color = COLORS[idx % COLORS.length];
          b._color = color;
          bounds.push([b.lat, b.lng]);
          var marker = L.marker([b.lat, b.lng], { icon: pinIcon(color) }).addTo(layer);
          var html = '<div class="bike-popup"><b>' + (b.name || 'eBike') + '</b><br/>' +
            (b.accuracy ? ('&plusmn;' + Math.round(b.accuracy) + ' m<br/>') : '') +
            fmtTime(b) + '<br/>' +
            '<a href="#" onclick="openMaps(' + b.lat + ',' + b.lng + ');return false;">Open in Maps</a></div>';
          marker.bindPopup(html);
          if (b.accuracy) {
            L.circle([b.lat, b.lng], { radius: b.accuracy, color: color, weight: 1, fillOpacity: 0.08 }).addTo(layer);
          }
        });

        // Footer: one row per bike, dot colored like its pin
        var footer = document.getElementById('footer');
        footer.style.display = 'block';
        footer.innerHTML = '';
        bikes.forEach(function (b) {
          var row = document.createElement('div');
          row.className = 'foot-row';
          var head = document.createElement('div');
          head.className = 'foot-head';
          var dot = document.createElement('span');
          dot.className = 'foot-dot';
          dot.style.background = b._color;
          var nm = document.createElement('span');
          nm.className = 'foot-name';
          nm.textContent = b.name || 'eBike';
          head.appendChild(dot); head.appendChild(nm);
          var tm = document.createElement('div');
          tm.className = 'foot-time';
          tm.textContent = footerTime(b);
          row.appendChild(head); row.appendChild(tm);
          footer.appendChild(row);
        });
        // Adapt footer height + map area to the number of rows (2 lines each)
        var fh = 12 + bikes.length * 48;
        footer.style.height = fh + 'px';
        document.getElementById('map').style.bottom = fh + 'px';
        if (map) setTimeout(function () { map.invalidateSize(); }, 50);

        if (bounds.length === 1) {
          map.setView(bounds[0], 15);
        } else {
          map.fitBounds(bounds, { padding: [30, 30] });
        }
      }

      window.openMaps = function (lat, lng) {
        Homey.popup('https://www.google.com/maps?q=' + lat + ',' + lng).catch(function () {});
      };

      function refresh() {
        Homey.api('GET', '/locations?sel=' + encodeURIComponent(JSON.stringify(deviceIds)), {})
          .then(render)
          .catch(function (err) {
            console.error(err);
            document.getElementById('empty').style.display = 'flex';
          });
      }

      refresh();
      // Refresh in step with the app's polling interval.
      setInterval(refresh, 5 * 60 * 1000);
    }
  </script>
</body>
</html>
